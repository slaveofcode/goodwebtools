name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  verify:
    name: Test · Build · Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test -- --run
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
