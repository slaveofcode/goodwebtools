<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GoodWebTools — page images</title>
    <link rel="stylesheet" href="popup.css" />
    <style>
      body { width: auto; max-width: 1100px; margin: 24px auto; padding: 16px; }
      .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
      .bar button, .bar select { border: 2px solid var(--fg); font: inherit; font-weight: 700; padding: 7px 10px; background: var(--row); color: var(--fg); cursor: pointer; }
      .bar .go { background: var(--accent); color: #fff; box-shadow: 3px 3px 0 var(--fg); }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
      label.card { display: block; border: 2px solid var(--fg); background: var(--row); padding: 6px; cursor: pointer; }
      label.card img { width: 100%; height: 120px; object-fit: contain; background: repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 0 0 / 16px 16px; display: block; }
      label.card span { display: block; font-size: 11px; color: var(--muted); margin-top: 4px; }
      label.card:has(input:checked) { border-color: var(--accent); box-shadow: 3px 3px 0 var(--accent); }
    </style>
  </head>
  <body>
    <h1 id="title"></h1>
    <p class="hint" id="from"></p>
    <div class="bar">
      <button type="button" id="all"></button>
      <button type="button" id="none"></button>
      <select id="format" aria-label="Format">
        <option value="original"></option><option value="webp">WebP</option><option value="png">PNG</option><option value="jpg">JPG</option>
      </select>
      <button type="button" id="zip" class="go"></button>
      <span id="status" class="hint"></span>
    </div>
    <div class="grid" id="grid"></div>
    <script type="module" src="images.js"></script>
  </body>
</html>
