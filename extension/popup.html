<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <strong>GoodWebTools</strong>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button><button type="button" data-lang="id">ID</button>
      </div>
    </header>
    <input id="q" type="search" autocomplete="off" spellcheck="false" />
    <ul id="results" role="listbox"></ul>
    <section id="home">
      <h2 id="favTitle"></h2>
      <ul id="favs" role="listbox"></ul>
      <h2 id="recentTitle"></h2>
      <ul id="recents" role="listbox"></ul>
      <h2 id="quickTitle"></h2>
      <div class="actions">
        <button type="button" id="qrPage"></button>
        <button type="button" id="capture"></button>
        <button type="button" id="panel" class="wide"></button>
      </div>
      <h2 id="pageTitle"></h2>
      <div class="actions">
        <button type="button" id="pgColor"></button>
        <button type="button" id="pgImages"></button>
        <button type="button" id="pgShot" class="wide"></button>
        <label class="wide check"><input type="checkbox" id="jsonTabs" /> <span id="jsonTabsLabel"></span></label>
      </div>
      <h2 id="recTitle"></h2>
      <div class="actions" id="recIdle">
        <button type="button" id="recTab"></button>
        <button type="button" id="recScreen"></button>
        <label class="wide check"><input type="checkbox" id="recMic" /> <span id="recMicLabel"></span></label>
      </div>
      <div class="actions" id="recOn" hidden>
        <button type="button" id="recStop" class="wide stop"></button>
      </div>
      <div id="access" hidden>
        <p id="accessText"></p>
        <button type="button" id="grant"></button>
      </div>
      <p class="hint"><span id="hotkeyLabel"></span> <span id="hotkey" class="kbd">—</span> · <span id="recKeyLabel"></span> <span id="recKey" class="kbd">—</span> · <a href="#" id="shortcuts"></a></p>
    </section>
    <script type="module" src="popup.js"></script>
  </body>
</html>
