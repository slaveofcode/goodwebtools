<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GoodWebTools — recording</title>
    <link rel="stylesheet" href="popup.css" />
    <style>
      body { width: auto; max-width: 960px; margin: 24px auto; padding: 16px; }
      video { width: 100%; max-height: 70vh; background: #000; border: 3px solid var(--fg); }
      .meta { color: var(--muted); margin: 8px 0 12px; }
      .actions { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
      .actions a { text-decoration: none; text-align: center; border: 2px solid var(--fg); background: var(--accent); color: #fff; font-weight: 700; padding: 8px; box-shadow: 3px 3px 0 var(--fg); }
      .actions button { background: var(--row); color: var(--fg); }
    </style>
  </head>
  <body>
    <h1 id="title"></h1>
    <video id="video" controls playsinline></video>
    <p class="meta" id="meta"></p>
    <div class="actions">
      <a id="download" href="#"></a>
      <button type="button" data-tool="video-convert" id="toMp4"></button>
      <button type="button" data-tool="video-to-gif" id="toGif"></button>
      <button type="button" data-tool="video-compress" id="compress"></button>
    </div>
    <p class="hint" id="note"></p>
    <script type="module" src="recording.js"></script>
  </body>
</html>
